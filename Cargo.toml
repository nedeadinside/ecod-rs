[package]
name = "ecod-rs"
version = "1.1.1"
edition = "2024"
description = "ECOD rust implementation."
license = "MIT"
repository = "https://github.com/nedeadinside/ecod-rs"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
bitcode = "0.6.9"
libm = "0.2.16"
num-traits = "0.2"
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
zstd = "0.14.2"
